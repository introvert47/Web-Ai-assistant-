<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voice & Text AI Companion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --purple-primary: #a855f7;
      --purple-gradient: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
      --text-dark: #1e1b4b;
      --text-muted: #6b7280;
      --glass-btn: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #8b5cf6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }

    .phone-container {
      width: 100%;
      max-width: 390px;
      height: 844px;
      max-height: 95vh;
      background: linear-gradient(160deg, #f5f3ff 0%, #ede9fe 40%, #e0e7ff 75%, #dbeafe 100%);
      border-radius: 44px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 24px 32px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Background Glow */
    .phone-container::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(217, 70, 239, 0.15) 50%, rgba(255,255,255,0) 80%);
      filter: blur(35px);
      pointer-events: none;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      margin-top: 10px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-btn);
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4c1d95;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-btn:active { transform: scale(0.90); }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.3px;
    }

    /* High-Gloss Fluid Orb Visualizer */
    .orb-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 10px auto 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .orb {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f472b6 0%, #c084fc 35%, #8b5cf6 70%, #6366f1 100%);
      box-shadow: 
        0 20px 45px rgba(139, 92, 246, 0.45), 
        inset -12px -12px 28px rgba(0,0,0,0.25), 
        inset 12px 12px 28px rgba(255,255,255,0.7);
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
    }

    /* Glass Specular Highlight Overlay */
    .orb::before {
      content: '';
      position: absolute;
      top: 5%;
      left: 15%;
      width: 70%;
      height: 40%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Swirling Lava Animation */
    .orb::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(244, 114, 182, 0.5), rgba(168, 85, 247, 0.35), transparent 70%);
      animation: rotateSwirl 8s infinite linear;
      mix-blend-mode: overlay;
    }

    @keyframes rotateSwirl {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.12); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .orb.listening {
      animation: floatPulse 1.2s ease-in-out infinite alternate;
      box-shadow: 0 25px 55px rgba(217, 70, 239, 0.6);
    }

    .orb.thinking {
      animation: floatPulse 1.6s ease-in-out infinite alternate;
      box-shadow: 0 20px 45px rgba(99, 102, 241, 0.55);
    }

    .orb.transcribing {
      animation: floatPulse 1s ease-in-out infinite alternate;
      box-shadow: 0 20px 45px rgba(244, 114, 182, 0.6);
    }

    .orb.speaking {
      animation: floatPulse 0.7s ease-in-out infinite alternate;
      box-shadow: 0 25px 55px rgba(192, 132, 252, 0.65);
    }

    @keyframes floatPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .icon-btn:disabled,
    .mic-btn:disabled,
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .chat-input:disabled {
      opacity: 0.6;
    }

    /* Subtitle & Status Text */
    .text-container {
      text-align: center;
      padding: 0 12px;
      z-index: 10;
      margin-bottom: auto;
    }

    .prompt-text {
      font-size: 0.9rem;
      color: #4b5563;
      line-height: 1.45;
      font-weight: 500;
      max-width: 300px;
      margin: 0 auto;
      max-height: 80px;
      overflow-y: auto;
    }

    .status-text {
      font-size: 0.85rem;
      color: #9333ea;
      font-weight: 600;
      margin-top: 10px;
      min-height: 20px;
    }

    .status-text.error { color: #ef4444; }

    /* Sliding Text Chat Drawer */
    .chat-drawer {
      position: absolute;
      bottom: 110px;
      left: 16px;
      right: 16px;
      top: 80px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: 16px;
      transform: translateY(120%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chat-drawer.open { transform: translateY(0); }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .chat-msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .chat-msg.user {
      align-self: flex-end;
      background: var(--purple-gradient);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .chat-msg.assistant {
      align-self: flex-start;
      background: #f3f4f6;
      color: var(--text-dark);
      border-bottom-left-radius: 4px;
    }

    .chat-input-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 20px;
      border: 1px solid #e5e7eb;
      font-size: 0.88rem;
      outline: none;
      background: white;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--purple-primary);
      color: white;
      border: none;
      cursor: pointer;
    }

    /* Sliding Settings Modal */
    .api-modal {
      position: absolute;
      inset: 0;
      background: rgba(245, 243, 255, 0.96);
      backdrop-filter: blur(18px);
      z-index: 100;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .api-modal.open { transform: translateY(0); }
    .api-modal { overflow-y: auto; }

    .field-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .modal-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .modal-title { font-size: 1.4rem; font-weight: 700; color: var(--text-dark); }
    .modal-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.4; }

    .input-group { margin-bottom: 18px; }
    .input-label { font-size: 0.8rem; font-weight: 600; color: #4c1d95; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .input-label a { color: #9333ea; text-decoration: underline; }

    .key-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(147, 51, 234, 0.2);
      background: white;
      font-size: 0.9rem;
      color: #1e1b4b;
      outline: none;
    }

    .save-btn {
      width: 100%;
      padding: 16px;
      border-radius: 24px;
      background: var(--purple-gradient);
      border: none;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(147, 51, 234, 0.3);
      margin-top: 10px;
      transition: transform 0.2s ease;
    }

    .save-btn:active { transform: scale(0.96); }

    /* Bottom Control Bar */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 10;
    }

    .mic-btn-outer {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--purple-gradient);
      border: none;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(147, 51, 234, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .mic-btn:active { transform: scale(0.92); }
  </style>
</head>
<body>

  <div class="phone-container">
    <header>
      <button class="icon-btn" id="settings-btn" aria-label="Open settings"><i class="fa-solid fa-gear"></i></button>
      <div class="header-title">Voice Chat</div>
      <button class="icon-btn" id="reset-btn" aria-label="Reset conversation"><i class="fa-solid fa-rotate-right"></i></button>
    </header>

    <div class="orb-wrapper">
      <div class="orb" id="orb"></div>
    </div>

    <div class="text-container">
      <div class="prompt-text" id="transcript">"Tap the microphone or chat icon to start talking."</div>
      <div class="status-text" id="status-text">Idle</div>
    </div>

    <!-- Text Chat Drawer Overlay -->
    <div class="chat-drawer" id="chat-drawer">
      <div class="chat-history" id="chat-history"></div>
      <div class="chat-input-bar">
        <input type="text" class="chat-input" id="text-input" placeholder="Type a message..." aria-label="Message input" />
        <button class="send-btn" id="send-btn" aria-label="Send message"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
      <button class="icon-btn" id="chat-toggle-btn" aria-label="Toggle text chat"><i class="fa-regular fa-comment"></i></button>
      <div class="mic-btn-outer">
        <button class="mic-btn" id="mic-btn" aria-label="Start or stop voice recording"><i class="fa-solid fa-microphone"></i></button>
      </div>
      <button class="icon-btn" id="trash-btn" aria-label="Clear conversation"><i class="fa-regular fa-trash-can"></i></button>
    </div>

    <!-- Sliding Settings Modal -->
    <div class="api-modal" id="api-modal">
      <div class="modal-header-row">
        <div class="modal-title">Setup AI Keys</div>
        <button class="icon-btn" id="close-settings-btn" style="width:36px; height:36px;" aria-label="Close settings"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-subtitle">Configure your API credentials to run the assistant natively.</div>

      <div class="input-group">
        <div class="input-label">
          <span>Gemini API Key</span>
          <a href="https://aistudio.google.com/app/apikey" target="_blank">Get Key</a>
        </div>
        <input type="password" id="gemini-key-input" class="key-input" placeholder="AIzaSy..." />
        <div class="field-hint">Required for voice input, voice output, and chat.</div>
      </div>

      <div class="input-group">
        <div class="input-label">
          <span>OpenRouter Key (Optional)</span>
          <a href="https://openrouter.ai/keys" target="_blank">Get Key</a>
        </div>
        <input type="password" id="openrouter-key-input" class="key-input" placeholder="sk-or-v1-..." />
        <div class="field-hint">Backup chat provider if Gemini is unavailable.</div>
      </div>

      <button class="save-btn" id="save-keys-btn">Save & Continue</button>
    </div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "https://esm.run/@google/genai";

    const modal = document.getElementById('api-modal');
    const geminiInput = document.getElementById('gemini-key-input');
    const openrouterInput = document.getElementById('openrouter-key-input');
    const saveBtn = document.getElementById('save-keys-btn');
    const settingsBtn = document.getElementById('settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    
    const micBtn = document.getElementById('mic-btn');
    const orb = document.getElementById('orb');
    const statusText = document.getElementById('status-text');
    const transcript = document.getElementById('transcript');
    const trashBtn = document.getElementById('trash-btn');
    const resetBtn = document.getElementById('reset-btn');

    const chatDrawer = document.getElementById('chat-drawer');
    const chatToggleBtn = document.getElementById('chat-toggle-btn');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const chatHistory = document.getElementById('chat-history');

    let history = [];
    let savedGeminiKey = localStorage.getItem('gemini_key') || "";
    let savedOpenRouterKey = localStorage.getItem('openrouter_key') || "";

    const ORB_STATES = ['listening', 'thinking', 'transcribing', 'speaking'];
    function setOrbState(state) {
      ORB_STATES.forEach(s => orb.classList.remove(s));
      if (state) orb.classList.add(state);
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      textInput.disabled = busy;
      micBtn.disabled = busy && !isRecording;
    }

    function saveHistory() {
      try {
        localStorage.setItem('chat_history', JSON.stringify(history));
      } catch (e) {
        console.error("Could not save chat history:", e);
      }
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem('chat_history');
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!Array.isArray(saved)) return;
        saved.forEach(entry => {
          const text = entry.parts && entry.parts[0] ? entry.parts[0].text : "";
          renderMessage(entry.role, text);
          history.push(entry);
        });
        if (history.length) {
          const last = history[history.length - 1];
          transcript.innerText = last.parts[0].text;
        }
      } catch (e) {
        console.error("Could not load chat history:", e);
      }
    }

    if (!savedGeminiKey && !savedOpenRouterKey) {
      modal.classList.add('open');
    } else {
      geminiInput.value = savedGeminiKey;
      openrouterInput.value = savedOpenRouterKey;
      statusText.innerText = "Ready";
    }

    loadHistory();

    settingsBtn.onclick = () => modal.classList.add('open');
    closeSettingsBtn.onclick = () => modal.classList.remove('open');

    saveBtn.onclick = () => {
      savedGeminiKey = geminiInput.value.trim();
      savedOpenRouterKey = openrouterInput.value.trim();

      if (!savedGeminiKey && !savedOpenRouterKey) {
        showError("Please paste an API key first.");
        return;
      }

      localStorage.setItem('gemini_key', savedGeminiKey);
      localStorage.setItem('openrouter_key', savedOpenRouterKey);
      modal.classList.remove('open');
      statusText.classList.remove('error');
      statusText.innerText = "Ready";
    };

    chatToggleBtn.onclick = () => chatDrawer.classList.toggle('open');
    trashBtn.onclick = resetConversation;
    resetBtn.onclick = resetConversation;

    function resetConversation() {
      history = [];
      localStorage.removeItem('chat_history');
      chatHistory.innerHTML = "";
      transcript.innerText = '"Tap the microphone or chat icon to start talking."';
      statusText.classList.remove('error');
      statusText.innerText = "Ready";
      window.speechSynthesis.cancel();
      if (typeof stopStreamedAudio === 'function') stopStreamedAudio();
      if (typeof isRecording !== 'undefined' && isRecording) stopRecording();
      setBusy(false);
      setOrbState(null);
    }

    function showError(msg) {
      statusText.classList.add('error');
      statusText.innerText = msg;
    }

    function renderMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-msg ${role === 'user' ? 'user' : 'assistant'}`;
      msgDiv.innerText = text;
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function appendMessage(role, text) {
      history.push({ role, parts: [{ text }] });
      renderMessage(role, text);
      saveHistory();
    }

    async function tryGemini(userText, formattedHistory) {
      const genAI = new GoogleGenAI({ apiKey: savedGeminiKey });
      const models = ["gemini-3.5-flash-lite", "gemini-3.8-flash"];
      let lastErr = null;

      for (const modelName of models) {
        const maxAttempts = 2;
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          try {
            const chat = genAI.chats.create({
              model: modelName,
              config: {
                systemInstruction: "You are a warm, casual AI friend. Keep replies concise under 2 sentences."
              },
              history: formattedHistory
            });

            const result = await chat.sendMessageStream({ message: userText });

            let fullResponse = "";
            for await (const chunk of result) {
              fullResponse += chunk.text;
            }
            return fullResponse;

          } catch (err) {
            lastErr = err;
            const msg = String(err && err.message ? err.message : err);
            const overloaded = msg.includes("503") || msg.toLowerCase().includes("overloaded") || msg.toLowerCase().includes("unavailable");
            if (overloaded && attempt < maxAttempts - 1) {
              statusText.innerText = `Model busy, retrying...`;
              await new Promise(r => setTimeout(r, 400));
              continue;
            }
            if (overloaded) break; // try next model in the list
            throw err; // non-overload error: stop immediately
          }
        }
      }
      throw lastErr;
    }

    async function tryOpenRouter(userText, formattedHistory) {
      const messages = [
        { role: "system", content: "You are a warm, casual AI friend. Keep replies concise under 2 sentences." },
        ...formattedHistory.map(h => ({
          role: h.role === 'model' ? 'assistant' : 'user',
          content: h.parts[0].text
        })),
        { role: "user", content: userText }
      ];

      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${savedOpenRouterKey}`
        },
        body: JSON.stringify({
          model: "openrouter/free",
          messages
        })
      });

      if (!response.ok) {
        const errBody = await response.text();
        throw new Error(`${response.status}: ${errBody}`);
      }

      const data = await response.json();
      return data.choices[0].message.content;
    }

    async function handleUserMessage(userText) {
      if (!userText.trim()) return;

      appendMessage('user', userText);
      transcript.innerText = `"${userText}"`;
      statusText.classList.remove('error');
      statusText.innerText = "Thinking...";
      setBusy(true);
      setOrbState('thinking');

      if (!navigator.onLine) {
        showError("Offline: Check internet connection.");
        setBusy(false);
        setOrbState(null);
        return;
      }

      const formattedHistory = history.slice(0, -1).map(h => ({
        role: h.role === 'user' ? 'user' : 'model',
        parts: h.parts
      }));

      let fullResponse = null;
      let geminiErr = null;

      if (savedGeminiKey) {
        try {
          fullResponse = await tryGemini(userText, formattedHistory);
        } catch (err) {
          geminiErr = err;
        }
      }

      if (fullResponse === null && savedOpenRouterKey) {
        try {
          if (savedGeminiKey) statusText.innerText = "Gemini unavailable, trying OpenRouter...";
          fullResponse = await tryOpenRouter(userText, formattedHistory);
        } catch (err) {
          parseAPIError(err);
          setBusy(false);
          setOrbState(null);
          return;
        }
      }

      if (fullResponse === null) {
        if (geminiErr) parseAPIError(geminiErr);
        else showError("No working provider. Check Settings.");
        setBusy(false);
        setOrbState(null);
        return;
      }

      appendMessage('model', fullResponse);
      transcript.innerText = fullResponse;
      setBusy(false);
      setOrbState(null);
      speak(fullResponse);
    }

    function parseAPIError(err) {
      console.error("Gemini API error:", err);
      const errStr = String(err && err.message ? err.message : err).toLowerCase();
      if (errStr.includes("403") || errStr.includes("api_key_invalid") || errStr.includes("invalid key")) {
        showError("Invalid API Key. Check Settings.");
      } else if (errStr.includes("429") || errStr.includes("resource_exhausted") || errStr.includes("quota")) {
        showError("Quota Limit Reached.");
      } else if (errStr.includes("503") || errStr.includes("overloaded") || errStr.includes("unavailable")) {
        showError("Model overloaded. Please try again in a moment.");
      } else {
        showError("API error: " + String(err && err.message ? err.message : err).slice(0, 120));
      }
    }

    sendBtn.onclick = () => {
      const text = textInput.value;
      textInput.value = "";
      handleUserMessage(text);
    };

    textInput.onkeypress = (e) => {
      if (e.key === 'Enter') sendBtn.click();
    };

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordingInterval = null;
    let recordingStartTime = 0;
    let vadRafId = null;

    function formatElapsed(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function transcribeWithGemini(base64Audio, mimeType) {
      const genAI = new GoogleGenAI({ apiKey: savedGeminiKey });
      const response = await genAI.models.generateContent({
        model: "gemini-3.5-flash-lite",
        contents: [{
          parts: [
            { text: "Transcribe the spoken words in this audio exactly as spoken. Output ONLY the transcript text, nothing else. If there is no clear speech, output nothing." },
            { inlineData: { mimeType, data: base64Audio } }
          ]
        }]
      });
      return (response.text || "").trim();
    }

    async function handleRecordedAudio(blob) {
      if (!savedGeminiKey) {
        showError("Gemini key required for voice transcription.");
        return;
      }
      setBusy(true);
      setOrbState('transcribing');
      statusText.innerText = "Transcribing...";
      try {
        const base64Audio = await blobToBase64(blob);
        const mimeType = blob.type || 'audio/webm';
        const transcript = await transcribeWithGemini(base64Audio, mimeType);
        if (!transcript) {
          showError("Couldn't catch that. Try again.");
          setBusy(false);
          setOrbState(null);
          return;
        }
        await handleUserMessage(transcript);
      } catch (err) {
        parseAPIError(err);
        setBusy(false);
        setOrbState(null);
      }
    }

    async function startRecording() {
      // Barge-in: stop any AI speech immediately when the user starts talking
      stopStreamedAudio();
      window.speechSynthesis.cancel();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          await handleRecordedAudio(blob);
        };
        mediaRecorder.start();
        isRecording = true;
        setOrbState('listening');
        statusText.classList.remove('error');
        recordingStartTime = Date.now();
        statusText.innerText = "Listening... 0:00 (tap mic to stop anytime)";
        recordingInterval = setInterval(() => {
          statusText.innerText = `Listening... ${formatElapsed(Date.now() - recordingStartTime)} (tap mic to stop anytime)`;
        }, 500);

        // Auto-stop: calibrate to this room's actual background noise first,
        // then watch for speech followed by a pause — so a noisy room doesn't
        // permanently look like "still talking" and get stuck until the max timer.
        const ctx = getAudioContext();
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        const CALIBRATION_MS = 350;
        const SPEECH_MARGIN = 14; // how much louder than the room's noise floor counts as "speech"
        const SILENCE_DURATION_MS = 1200;
        const MAX_RECORD_MS = 20000;
        let noiseFloor = 0;
        let calibrationSamples = 0;
        let hasSpoken = false;
        let silenceStart = null;
        const beganAt = Date.now();

        const getRms = () => {
          analyser.getByteTimeDomainData(dataArray);
          let sumSquares = 0;
          for (let i = 0; i < dataArray.length; i++) {
            const v = dataArray[i] - 128;
            sumSquares += v * v;
          }
          return Math.sqrt(sumSquares / dataArray.length);
        };

        const checkVolume = () => {
          if (!isRecording) return;
          const elapsed = Date.now() - beganAt;
          const rms = getRms();

          if (elapsed < CALIBRATION_MS) {
            // Sample ambient noise before deciding what counts as "speech"
            noiseFloor = (noiseFloor * calibrationSamples + rms) / (calibrationSamples + 1);
            calibrationSamples++;
            vadRafId = requestAnimationFrame(checkVolume);
            return;
          }

          const threshold = noiseFloor + SPEECH_MARGIN;

          if (rms > threshold) {
            hasSpoken = true;
            silenceStart = null;
          } else if (hasSpoken) {
            if (silenceStart === null) silenceStart = Date.now();
            else if (Date.now() - silenceStart > SILENCE_DURATION_MS) {
              stopRecording();
              return;
            }
          }

          if (Date.now() - beganAt > MAX_RECORD_MS) {
            stopRecording();
            return;
          }

          vadRafId = requestAnimationFrame(checkVolume);
        };
        vadRafId = requestAnimationFrame(checkVolume);
      } catch (err) {
        showError("Mic access denied or unavailable.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        setOrbState(null);
        if (recordingInterval) { clearInterval(recordingInterval); recordingInterval = null; }
        if (vadRafId) { cancelAnimationFrame(vadRafId); vadRafId = null; }
      }
    }

    if (!navigator.mediaDevices || !window.MediaRecorder) {
      showError("Microphone recording not supported in this browser.");
    } else {
      micBtn.onclick = () => {
        if (!savedGeminiKey && !savedOpenRouterKey) {
          modal.classList.add('open');
          return;
        }
        if (!savedGeminiKey) {
          showError("Voice input needs a Gemini key. Check Settings.");
          return;
        }
        if (!isRecording) {
          startRecording();
        } else {
          stopRecording();
        }
      };
    }

    let cachedVoices = [];
    window.speechSynthesis && (window.speechSynthesis.onvoiceschanged = () => {
      cachedVoices = window.speechSynthesis.getVoices();
    });

    function speakWithBrowserVoice(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v =>
        v.name.includes("Google US English") ||
        v.name.includes("Natural") ||
        v.name.includes("Samantha") ||
        (v.lang.startsWith("en") && v.localService === false)
      );
      if (preferredVoice) utterance.voice = preferredVoice;
      utterance.pitch = 1.0;
      utterance.rate = 1.0;
      utterance.onstart = () => { statusText.innerText = "Speaking..."; setOrbState('speaking'); };
      utterance.onend = () => { statusText.innerText = "Ready"; setOrbState(null); };
      window.speechSynthesis.speak(utterance);
    }

    let audioCtx = null;
    let activeSources = [];

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function stopStreamedAudio() {
      activeSources.forEach(s => { try { s.stop(); } catch (e) {} });
      activeSources = [];
    }

    async function speak(text) {
      stopStreamedAudio();
      window.speechSynthesis.cancel();

      if (savedGeminiKey) {
        try {
          const genAI = new GoogleGenAI({ apiKey: savedGeminiKey });
          const stream = await genAI.models.generateContentStream({
            model: "gemini-3.1-flash-tts-preview",
            contents: text,
            config: {
              responseModalities: ['AUDIO'],
              speechConfig: {
                voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } }
              }
            }
          });

          const ctx = getAudioContext();
          if (ctx.state === 'suspended') await ctx.resume();

          let nextStartTime = ctx.currentTime;
          let gotChunk = false;
          let pendingSources = 0;
          let streamDone = false;

          const checkFinished = () => {
            if (streamDone && pendingSources === 0) { statusText.innerText = "Ready"; setOrbState(null); }
          };

          for await (const chunk of stream) {
            const data = chunk.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            if (!data) continue;

            if (!gotChunk) { gotChunk = true; statusText.innerText = "Speaking..."; setOrbState('speaking'); }

            const pcmBytes = Uint8Array.from(atob(data), c => c.charCodeAt(0));
            const sampleCount = pcmBytes.length / 2;
            const view = new DataView(pcmBytes.buffer);
            const float32 = new Float32Array(sampleCount);
            for (let i = 0; i < sampleCount; i++) {
              float32[i] = view.getInt16(i * 2, true) / 32768;
            }

            const audioBuffer = ctx.createBuffer(1, sampleCount, 24000);
            audioBuffer.copyToChannel(float32, 0);

            const source = ctx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(ctx.destination);

            const startAt = Math.max(nextStartTime, ctx.currentTime);
            source.start(startAt);
            nextStartTime = startAt + audioBuffer.duration;

            activeSources.push(source);
            pendingSources++;
            source.onended = () => {
              pendingSources--;
              activeSources = activeSources.filter(s => s !== source);
              checkFinished();
            };
          }

          streamDone = true;
          checkFinished();

          if (!gotChunk) throw new Error("No audio returned from TTS model");
          return;

        } catch (err) {
          console.error("Gemini TTS failed, falling back to browser voice:", err);
        }
      }

      speakWithBrowserVoice(text);
    }
  </script>
